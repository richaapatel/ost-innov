services:
  mysql:
    image: mysql:8.0
    container_name: skillswap-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-skillswap}
      MYSQL_USER: ${DB_USER:-skillswap_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-skillswap_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - skillswap_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  skillswap_mysql_data:
